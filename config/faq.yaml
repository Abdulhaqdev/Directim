# Boshlang'ich xotira (Morechat'dagi «Saqlangan javoblar»). Birinchi ishga tushishda bazaga yuklanadi,
# keyin panelning «Xotira» bo'limida tahrirlanadi.
- savol: Almashtirish yoki qaytarish mumkinmi?
  javob: Agar mahsulot rasmdagidek bormasa, rad etishingiz mumkin.
- savol: Qanday to'lov turlari bor?
  javob: Oldindan to'lov yo'q, mahsulot kelganda to'laysiz.
- savol: Qanday qilib buyurtma beraman?
  javob: Telefon raqamingizni qoldirasiz — operatorimiz bog'lanib buyurtmani rasmiylashtiradi.
- savol: Mahsulot hozir bormi?
  javob: Mahsulotlar mavjud, oldindan to'lov talab qilinmaydi.
- savol: Manzilingiz qayerda?
  javob: O'zbekiston bo'ylab onlayn buyurtma qabul qilamiz.
- savol: Yetkazib berish bormi?
  javob: Ha, O'zbekiston bo'ylab yetkazamiz. Toshkentga 1 kunda, viloyatlarga 2–3 kunda; dastavka 30 000 so'mdan.
- savol: Sovg'aga mos mahsulot bormi?
  javob: «Qalbimda Qur'on pazllari» va «Saodat asri» yaqinlar uchun mazmunli sovg'a sifatida yaxshi tanlov.
