<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kirish — Sotuv agenti</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#0f172a;--muted:#64748b;--line:#e6e8ec;--accent:#0e9f6e;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0c1113;--surface:#141b1e;--text:#e6edf0;--muted:#94a3ab;--line:#253036;--accent:#34d399;--danger:#f87171}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:21px}p{margin:0 0 20px;color:var(--muted)}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--text);margin-bottom:12px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--danger);font-size:14px;margin-bottom:12px}
</style></head><body>
<form class="box" method="post" action="/kirish">
  <div class="logo">🛍</div>
  <h1>Sotuv agenti</h1>
  <p>Instagram AI-sotuvchingiz paneli</p>
  {% if no_password %}<div class="err">.env faylida ADMIN_PASSWORD yozilmagan — avval parol qo'ying.</div>{% endif %}
  {% if xato %}<div class="err">Parol noto'g'ri</div>{% endif %}
  <input type="password" name="parol" placeholder="Parol" autofocus required>
  <button>Kirish</button>
</form></body></html>
